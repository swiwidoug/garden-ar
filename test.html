<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden AR test</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; font-family: system-ui, sans-serif; background: #f3f1ea; }
    header { padding: 12px 16px; font-weight: 600; }
    .pick { display: flex; gap: 8px; padding: 0 16px 8px; }
    .pick button { flex: 1; padding: 10px; border: 1px solid #2f6b3a; border-radius: 12px; background: #fff; color: #2f6b3a; font-size: 15px; }
    .pick button.on { background: #2f6b3a; color: #fff; }
    model-viewer { width: 100%; height: 45vh; }
    .bar { padding: 12px 16px; text-align: center; }
    #arbtn { width: 100%; max-width: 360px; padding: 16px 24px; border: none; border-radius: 28px;
             background: #2f6b3a; color: #fff; font-size: 18px; font-weight: 600; }
    .links { padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
    .links a { display: block; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid #999; color: #222; text-decoration: none; text-align: center; }
    #log { margin: 8px 16px 24px; padding: 10px; background: #fff; border-radius: 8px; font: 12px/1.5 monospace; white-space: pre-wrap; word-break: break-all; }
    .clear { font-size: 12px; color: #555; background: none; border: none; text-decoration: underline; }
  </style>
</head>
<body>
  <header>Garden AR – test page v2</header>
  <div class="pick">
    <button id="b1" class="on">Brick cube (2 m)</button>
    <button id="b2">Google astronaut</button>
  </div>
  <model-viewer id="mv"
      src="brick_cube_test.glb"
      alt="test model"
      ar
      ar-modes="webxr scene-viewer"
      ar-scale="fixed"
      ar-placement="floor"
      camera-controls
      shadow-intensity="1">
  </model-viewer>
  <div class="bar">
    <button id="arbtn">View in your garden</button>
  </div>
  <div class="links">
    <a id="sv1" href="#">Direct test A: Scene Viewer via Google app (astronaut)</a>
    <a id="sv2" href="#">Direct test B: Scene Viewer via Play Services for AR (astronaut)</a>
  </div>
  <div id="log"></div>
  <div style="text-align:center;padding-bottom:24px"><button class="clear" id="clr">clear log</button></div>
  <script>
    const mv = document.getElementById('mv');
    const logEl = document.getElementById('log');
    const KEY = 'garden-ar-log';
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      const prev = sessionStorage.getItem(KEY) || '';
      const next = prev + t + '  ' + msg + '\n';
      sessionStorage.setItem(KEY, next);
      logEl.textContent = next;
    }
    logEl.textContent = sessionStorage.getItem(KEY) || '';
    document.getElementById('clr').onclick = () => { sessionStorage.removeItem(KEY); logEl.textContent = ''; };

    log('--- page loaded ---');
    log('UA: ' + navigator.userAgent);
    if (navigator.xr) {
      navigator.xr.isSessionSupported('immersive-ar')
        .then(ok => log('WebXR immersive-ar supported: ' + ok))
        .catch(e => log('WebXR check error: ' + e.message));
    } else {
      log('navigator.xr not present (no WebXR in this browser view)');
    }

    const models = { b1: 'brick_cube_test.glb', b2: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb' };
    for (const id of Object.keys(models)) {
      document.getElementById(id).addEventListener('click', () => {
        mv.src = models[id];
        for (const k of Object.keys(models)) document.getElementById(k).classList.toggle('on', k === id);
      });
    }
    mv.addEventListener('load', () => log('model loaded: ' + mv.src.split('/').pop() + ' | canActivateAR=' + mv.canActivateAR));
    mv.addEventListener('error', e => log('model error: ' + (e.detail && e.detail.sourceError ? e.detail.sourceError.message : '?')));
    mv.addEventListener('ar-status', e => log('ar-status: ' + e.detail.status));
    document.getElementById('arbtn').addEventListener('click', () => {
      log('button pressed, activateAR()');
      try { mv.activateAR(); } catch (e) { log('activateAR threw: ' + e.message); }
    });

    // Direct Scene Viewer intents, bypassing model-viewer entirely
    const astro = 'https://modelviewer.dev/shared-assets/models/Astronaut.glb';
    const here = location.href.split('#')[0];
    const fb = encodeURIComponent(here + '#back-from-sv');
    const a = 'intent://arvr.google.com/scene-viewer/1.0?file=' + encodeURIComponent(astro) + '&mode=ar_preferred&title=Astronaut'
            + '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=' + fb + ';end;';
    const b = 'intent://arvr.google.com/scene-viewer/1.0?file=' + encodeURIComponent(astro) + '&mode=ar_only&title=Astronaut'
            + '#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=' + fb + ';end;';
    document.getElementById('sv1').href = a;
    document.getElementById('sv2').href = b;
    document.getElementById('sv1').addEventListener('click', () => log('direct test A tapped'));
    document.getElementById('sv2').addEventListener('click', () => log('direct test B tapped'));
    if (location.hash === '#back-from-sv') log('returned via fallback URL: Scene Viewer did not open');
  </script>
</body>
</html>
