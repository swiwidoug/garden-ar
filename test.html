<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden AR test</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f3f1ea; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 12px 16px; font-weight: 600; }
    .pick { display: flex; gap: 8px; padding: 0 16px 8px; }
    .pick button { flex: 1; padding: 10px; border: 1px solid #2f6b3a; border-radius: 12px; background: #fff; color: #2f6b3a; font-size: 15px; }
    .pick button.on { background: #2f6b3a; color: #fff; }
    model-viewer { flex: 1; width: 100%; min-height: 0; }
    .bar { padding: 12px 16px 20px; text-align: center; }
    #arbtn { width: 100%; max-width: 360px; padding: 16px 24px; border: none; border-radius: 28px;
             background: #2f6b3a; color: #fff; font-size: 18px; font-weight: 600; }
    #status { margin-top: 8px; font-size: 13px; color: #555; min-height: 18px; }
  </style>
</head>
<body>
  <header>Garden AR – test page</header>
  <div class="pick">
    <button id="b1" class="on">Brick cube (2 m)</button>
    <button id="b2">Google astronaut</button>
  </div>
  <model-viewer id="mv"
      src="brick_cube_test.glb"
      alt="test model"
      ar
      ar-modes="scene-viewer webxr"
      ar-scale="fixed"
      ar-placement="floor"
      camera-controls
      shadow-intensity="1">
  </model-viewer>
  <div class="bar">
    <button id="arbtn">View in your garden</button>
    <div id="status">Loading model…</div>
  </div>
  <script>
    const mv = document.getElementById('mv');
    const btn = document.getElementById('arbtn');
    const st = document.getElementById('status');
    const models = {
      b1: 'brick_cube_test.glb',
      b2: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb'
    };
    for (const id of Object.keys(models)) {
      document.getElementById(id).addEventListener('click', () => {
        mv.src = models[id];
        st.textContent = 'Loading model…';
        for (const k of Object.keys(models)) document.getElementById(k).classList.toggle('on', k === id);
      });
    }
    mv.addEventListener('load', () => {
      st.textContent = 'Model loaded. AR available: ' + (mv.canActivateAR ? 'yes' : 'no');
    });
    mv.addEventListener('error', (e) => {
      const d = e.detail && e.detail.sourceError ? e.detail.sourceError.message : 'could not load the model';
      st.textContent = 'Error: ' + d;
    });
    mv.addEventListener('ar-status', (e) => {
      st.textContent = 'AR status: ' + e.detail.status;
    });
    btn.addEventListener('click', () => {
      if (mv.canActivateAR) { mv.activateAR(); }
      else { st.textContent = 'AR is not available in this browser'; }
    });
  </script>
</body>
</html>
