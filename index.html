<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garden AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f3f1ea; }
    header { padding: 12px 16px; font-weight: 600; }
    model-viewer { width: 100%; height: calc(100% - 48px); }
    .ar-btn {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border: none; border-radius: 28px;
      background: #2f6b3a; color: #fff; font-size: 17px; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
  </style>
</head>
<body>
  <header>Garden AR – brick cube test</header>
  <!-- To show a different model, change the src below to the .glb file name -->
  <model-viewer
      src="brick_cube_test.glb"
      alt="2 m brick cube test model"
      ar
      ar-modes="scene-viewer webxr"
      ar-scale="fixed"
      ar-placement="floor"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1">
    <button slot="ar-button" class="ar-btn">View in your garden</button>
  </model-viewer>
</body>
</html>
